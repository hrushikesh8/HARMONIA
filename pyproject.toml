[project]
name = "harmonia"
version = "0.1.0"
description = "Deterministic music infrastructure and personal music library system."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "mutagen>=1.47",
    "typer>=0.12",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
]

[project.scripts]
harmonia = "harmonia.cli.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- Ruff ---

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # function call in argument defaults (standard for FastAPI / Typer)
    "TC001",  # first-party imports needed at runtime for Pydantic schema validation
    "TC002",  # third-party imports needed at runtime
    "TC003",  # stdlib imports needed at runtime for Pydantic/Typer
]

[tool.ruff.lint.isort]
known-first-party = ["harmonia"]

# --- Mypy ---

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mutagen.*"]
ignore_missing_imports = true

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
